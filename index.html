*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Baloo",ui-rounded,"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;font-weight:800}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
body:not(.ads-on) .adslot{display:none!important}
.adslot{min-height:90px;width:100%;max-width:340px;margin:150px auto 10px;border-radius:12px;background:rgba(0,0,0,.06)}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.screen.dim{background:rgba(20,10,40,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto 0}
.screen .wrap>*{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:8px 24px 12px;border-radius:18px;font-size:22px;color:#fff;background:linear-gradient(180deg,var(--c1,#ff9a6b),var(--c2,#ff6b4a));box-shadow:0 5px 0 var(--c3,#b8321a),0 9px 18px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c3,#b8321a),0 3px 8px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.g{--c1:#74e597;--c2:#33c065;--c3:#18793c}.btn.y{--c1:#ffe07a;--c2:#ffbf2e;--c3:#b87600;color:#6b3a00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.b{--c1:#8cc2ff;--c2:#4c93f5;--c3:#2556a8}.btn.p{--c1:#c9a4ff;--c2:#9b63f5;--c3:#5a32a8}.btn.w{--c1:#fff;--c2:#f1ecf6;--c3:#cdbfdc;color:var(--ink);text-shadow:none}
.btn.big{min-height:68px;font-size:32px;padding:8px 48px 14px;border-radius:22px}
.btn.sm{min-height:44px;font-size:18px;padding:6px 16px 9px;border-radius:14px}
.btn[disabled]{filter:grayscale(.85);opacity:.6}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.panel{width:100%;background:rgba(255,255,255,.94);border-radius:22px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.1),0 14px 30px rgba(0,0,0,.18);color:var(--ink)}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h2{font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.ib{width:50px;height:50px;min-height:50px;padding:0;border-radius:16px;font-size:24px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);color:#fff;border-radius:999px;padding:4px 14px 6px;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 40%,#e09a00);box-shadow:inset 0 -2px 0 rgba(150,80,0,.5),0 1px 0 rgba(0,0,0,.2)}
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;font-size:19px;border-bottom:2px solid rgba(0,0,0,.06)}
.set:last-child{border:0}
.seg{display:flex;background:rgba(0,0,0,.08);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:16px;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:60;background:rgba(30,20,60,.92);color:#fff;padding:10px 18px;border-radius:16px;font-size:18px;pointer-events:none;animation:pop .35s both;text-align:center;max-width:90vw}
.help p{font-size:17px;line-height:1.35;margin:6px 0}
.byline{font-size:20px;color:#fff;opacity:.95;text-shadow:0 2px 0 rgba(0,0,0,.25);margin-top:-8px}
.stars{display:flex;gap:6px;justify-content:center}
.stars i{width:54px;height:54px;display:block;background:no-repeat center/contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}

:root{--bg:#f6d9c8;--ink:#4a2a3e;--acc:#ff7a59;--tr:#fffaf4}

@keyframes glow{50%{box-shadow:0 5px 0 #18793c,0 0 0 6px rgba(116,229,151,.45),0 9px 18px rgba(0,0,0,.22)}}
#tray{position:fixed;z-index:10;left:0;right:0;bottom:0;height:clamp(250px,40vh,360px);background:var(--tr);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(110,50,60,.22);display:flex;flex-direction:column;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 6px);gap:6px}
.land #tray{left:auto;top:0;height:auto;width:clamp(270px,38vw,380px);border-radius:24px 0 0 24px;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) 8px 10px}
.rooms,.chips{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;flex:none;touch-action:pan-x;scrollbar-width:none;padding:2px 0}
.rooms::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.rt{flex:none;padding:5px 12px;border-radius:12px;background:#f1e4dc;font-size:14px;color:var(--ink)}
.rt.on{background:var(--ink);color:#fff}.rt small{opacity:.7}
.chip{flex:none;display:flex;align-items:center;gap:4px;padding:5px 10px 6px;border-radius:14px;background:#fff;border:2px solid #f0ddd2;font-size:13px;color:var(--ink);position:relative}
.chip span{font-size:16px}.chip i{font-style:normal;color:#2fa863;font-size:12px}
.chip.on{border-color:var(--acc);background:#fff1ea;box-shadow:0 0 0 2px rgba(255,122,89,.25)}
.trh{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;min-height:36px}
.trh b{font-size:18px}.trh .btn.sm{min-height:34px;font-size:15px;padding:3px 10px 6px;margin-left:4px}
.sw{display:flex;align-items:center;gap:7px;overflow-x:auto;flex:none;min-height:34px;touch-action:pan-x;scrollbar-width:none;padding:2px}
.sw::-webkit-scrollbar{display:none}
.swl{font-size:13px;color:#8a6a7c;white-space:nowrap}
.sd{flex:none;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),rgba(255,255,255,0) 50%),var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.2);position:relative}
.sd.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc)}
.sd.pal:after{content:"♥";position:absolute;right:-5px;top:-7px;font-size:11px;color:#e5486d;text-shadow:0 0 2px #fff,0 0 2px #fff}
.cards{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px;align-content:start;touch-action:pan-y;padding:2px 2px 6px}
.cd{position:relative;display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:14px;padding:4px 3px 5px;border:2px solid #f2e3d9;box-shadow:0 3px 0 #ecd9cc;color:var(--ink)}
.cd img{width:72px;height:72px;display:block}
.cd b{font-size:11.5px;line-height:1.1;text-align:center;min-height:25px;display:flex;align-items:center}
.cd em{font-style:normal;font-size:12px;color:#2f8f5a}
.cd.on{border-color:var(--acc);background:#fff4ee}
.cd .lk2{position:absolute;top:3px;right:6px;font-style:normal;color:#e5486d;font-size:14px}
.cd.lk img{filter:grayscale(.4) brightness(1.05);opacity:.7}
.cd u{position:absolute;top:28px;left:50%;transform:translateX(-50%);text-decoration:none;background:rgba(74,42,62,.88);color:#fff;font-size:12px;border-radius:10px;padding:2px 7px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.cd u .coin{width:13px;height:13px}
.empty{grid-column:1/-1;text-align:center;color:#8a6a7c;font-size:16px;padding:18px 8px;line-height:1.4}
#tip{position:fixed;z-index:15;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:16px;font-size:16px;max-width:86vw;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.25);pointer-events:none;animation:bob 1.4s ease-in-out infinite}
.land #tip{left:calc((100vw - clamp(270px,38vw,380px))/2)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
#viewBar{position:fixed;z-index:10;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
#viewBar b{background:rgba(255,255,255,.9);border-radius:14px;padding:8px 14px;font-size:16px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{gap:14px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;font-size:76px;letter-spacing:1px;filter:drop-shadow(0 6px 0 rgba(120,40,70,.35)) drop-shadow(0 12px 22px rgba(0,0,0,.25))}
.logo .a{color:#fff;-webkit-text-stroke:2px #c04f6e;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:900}
.logo .b{color:#ffd166;-webkit-text-stroke:2px #b05a2a;font-size:1.12em;text-transform:uppercase}
.tag{font-size:19px;color:#fff;background:rgba(74,42,62,.62);padding:5px 16px;border-radius:999px;backdrop-filter:blur(3px)}
#scrTitle .byline{color:#fff;font-size:18px;background:rgba(74,42,62,.5);padding:2px 14px;border-radius:999px;margin-top:0}

.screen.dim{background:rgba(74,30,50,.5)}
.wrap.wide{max-width:720px}
.topbar h2{flex:1;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px 9px;border-radius:14px;background:rgba(255,255,255,.55);font-size:15px;color:var(--ink)}
.tab.on{background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}.tab.lkd{opacity:.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;width:100%}
.lvc{position:relative;display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto auto;column-gap:10px;text-align:left;align-items:center;background:#fffaf4;border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 rgba(0,0,0,.12);color:var(--ink)}
.lvc img{grid-row:1/4;width:52px;height:52px;border-radius:50%;background:#fde8dc}
.lvc .n{position:absolute;left:4px;top:4px;background:var(--acc);color:#fff;font-size:12px;border-radius:9px;padding:0 6px}
.lvc b{font-size:15px;line-height:1.1}.lvc small{font-size:12px;color:#8a6a7c}
.lvc .st{color:#f4b400;font-size:16px;letter-spacing:1px}
.lvc.lkd{filter:grayscale(.8);opacity:.65}.lvc.clr{background:#fff}
.brief{max-width:460px}
.bh{display:flex;gap:12px;align-items:center}
.bh img,.eh img{width:84px;height:84px;border-radius:50%;flex:none;background:#fde8dc;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.bh small{color:#a06a80;font-size:13px}.bh h2{font-size:24px;line-height:1.1}
.bq{background:#fff3ec;border-radius:14px;padding:7px 10px;font-size:14.5px;line-height:1.3;margin-top:4px;font-weight:700}
.bq b{font-size:13px;color:#a06a80}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
.bg>div{background:#faf3ee;border-radius:12px;padding:6px 9px;display:flex;flex-direction:column}
.bg span,.bm span{font-size:12px;color:#a06a80;text-transform:uppercase;letter-spacing:.5px}
.bg b{font-size:16px}.bg small{font-size:12px;color:#8a6a7c}
.fds{font-size:13px!important;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.fd{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);vertical-align:-2px}
.bm{background:#eef9f1;border-radius:12px;padding:7px 10px}.bm p{font-size:15px;margin:3px 0;color:#25603d}
.bn{font-size:14px;margin:8px 0 0;background:#f2edff;border-radius:12px;padding:6px 10px;color:#4b3a85}
.brief .row{margin-top:12px}
.center{text-align:center}.col{display:flex;flex-direction:column;gap:10px;margin-top:10px;align-items:center}
.endp{max-width:440px}
.eh{display:flex;gap:10px;align-items:center;text-align:left}
.mood{margin-top:8px}.mood small{display:block;font-size:13px;color:#a06a80}.mood b{font-size:46px;line-height:1;color:var(--acc)}
.stars.big{margin:2px 0 6px}.stars .s{font-style:normal;font-size:44px;color:#e7dcd6;display:inline-block}
.stars .s.on{color:#ffc21a;text-shadow:0 3px 0 #d98a00;animation:spop .5s cubic-bezier(.2,1.8,.4,1) both;animation-delay:var(--d)}
@keyframes spop{from{transform:scale(0) rotate(-40deg)}}
.shots{display:flex;gap:6px;justify-content:center;margin:4px 0 8px}.shots img{flex:1;min-width:0;max-width:200px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.mt{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;font-size:14px;text-align:left;margin:4px 0}
.mt .bar{height:10px;border-radius:6px;background:#f1e4dc;overflow:hidden}.mt .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb38a,#ff7a59);border-radius:6px}
.mt em{font-style:normal;color:#8a6a7c;font-size:13px}
.el{font-size:13.5px;color:#7a5468;margin:6px 0}.el.warn{color:#c2414b}
.ec{font-size:24px;color:#c68a00;display:flex;justify-content:center;align-items:center;gap:6px;margin:4px 0}
.endp .row{margin-top:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;width:100%}
.gc{background:#fffaf4;border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 0 rgba(0,0,0,.12);color:var(--ink);text-align:left}
.gc img{width:100%;border-radius:11px;aspect-ratio:240/186;background:#eee}.gc b{font-size:14px}.gc small{color:#c68a00;font-size:13px}
.gal .empty{color:#fff;background:rgba(0,0,0,.25);border-radius:16px}
#shopBox h3{font-size:18px;margin:4px 0 8px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.si{background:#faf3ee;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.si img{width:80px;height:80px}.si b{font-size:13px;line-height:1.1}.si small{font-size:11px;color:#8a6a7c}
.si em{font-style:normal;font-size:12px;color:#2f8f5a}.si .btn.sm{min-height:34px;font-size:15px;padding:3px 10px 6px}
.si.own{background:#eef9f1}
.toast{top:calc(env(safe-area-inset-top,0px) + 62px)}
@media (max-height:500px) and (orientation:landscape){.logo{font-size:52px}.title{gap:8px}.bh img,.eh img{width:60px;height:60px}.mood b{font-size:34px}.stars .s{font-size:34px}.shots img{max-width:150px}}
@media (max-width:380px){.logo{font-size:64px}.hl b{font-size:13px}#bDone{padding:4px 10px 8px;font-size:16px}}
@media (orientation:landscape) and (max-height:560px){.brief{max-width:700px;padding:10px 14px}.wrap:has(.brief){max-width:700px}.bh h2{font-size:20px}.bq{font-size:13px;padding:5px 9px}.bg{grid-template-columns:repeat(4,1fr);margin:6px 0;gap:5px}.bg b{font-size:14px}.bm{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;padding:5px 10px}.bm span{width:100%}.bm p{margin:0;font-size:14px}.bn{font-size:12.5px;margin-top:5px;padding:4px 9px}.brief .row{margin-top:7px}.brief .btn{min-height:44px;font-size:18px}
.endp{max-width:680px;display:grid;grid-template-columns:1fr 1fr;column-gap:14px;align-items:center;padding:10px 14px}.endp>.eh{grid-column:1/-1}.endp .shots{grid-column:1;grid-row:2/6}.endp .mood,.endp .stars{grid-column:2}.endp .mt,.endp .el,.endp .ec,.endp .row{grid-column:1/-1}.endp .mt{margin:2px 0}.endp .mood b{font-size:30px}.endp .stars .s{font-size:30px}.endp .shots img{max-width:260px}}
#scrEnd,#scrGal,#scrShop,#scrMap{padding-top:calc(env(safe-area-inset-top,0px) + 58px)}
.land .cards{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}.land .cd img{width:60px;height:60px}
@media (orientation:landscape) and (max-height:430px){
#scrTitle .wrap{padding:4px 0}.title{gap:5px}.logo{font-size:40px}#scrTitle .tag{font-size:14px;padding:3px 12px}#scrTitle .byline{font-size:14px}
#scrTitle .btn.big{padding-top:8px;padding-bottom:8px;font-size:24px}
#scrTitle .row .btn.sm{padding-top:6px;padding-bottom:6px}
#scrMap{padding-top:calc(env(safe-area-inset-top,0px) + 52px);padding-bottom:6px}
#scrMap .wrap.wide{height:100%;max-height:100%;display:flex;flex-direction:column;gap:6px;justify-content:flex-start}
#scrMap .grid{flex:1;min-height:0;overflow-y:auto;grid-template-columns:repeat(3,1fr)}
#scrMap .lvc{min-height:0}
}
